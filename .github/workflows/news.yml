name: news-feed

on:
  schedule:
    - cron: "0 * * * *"      # every hour, on the hour
  workflow_dispatch:          # also runs when you press "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fetch USD high-impact events
        run: python fetch_news.py

      - name: Commit news.json if it changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "news update"
          file_pattern: news.json
