name: news-watchdog

on:
  schedule:
    - cron: "20 * * * *"     # every hour, 20 minutes past, after the news job
  workflow_dispatch:          # run it by hand to check

permissions:
  actions: write              # lets this job re-run the news job
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check news.json and re-run the news job if needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          RAW="https://raw.githubusercontent.com/${REPO}/main/news.json"
          MAX_AGE_SECONDS=7200     # news.json should be updated at least every 2 hours
          NOW=$(date +%s)

          if curl -sf "$RAW" -o news.json; then
            FETCHED=$(python3 -c "import json;print(int(json.load(open('news.json')).get('fetched_at',0)))" 2>/dev/null || echo 0)
          else
            FETCHED=0
          fi

          if [ "$FETCHED" -eq 0 ]; then
            echo "news.json is missing or unreadable: re-running the news job"
            STALE=1
          else
            AGE=$(( NOW - FETCHED ))
            echo "news.json is ${AGE} seconds old (limit ${MAX_AGE_SECONDS})"
            [ "$AGE" -gt "$MAX_AGE_SECONDS" ] && STALE=1 || STALE=0
          fi

          if [ "$STALE" -eq 1 ]; then
            if gh workflow run news.yml --repo "$REPO"; then
              echo "news job re-run requested"
            else
              echo "ERROR: could not request the news job re-run"
              exit 1          # only a failed trigger counts as a failure
            fi
          else
            echo "news feed is fresh"
          fi
